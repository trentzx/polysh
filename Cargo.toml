[package]
name = "polysh"
version = "0.2.0"
edition = "2021"
description = "A shell that understands Windows cmd and Linux/macOS commands, and translates them to whatever OS you're on."
license = "MIT"
repository = "https://github.com/trentzx/polysh"
readme = "README.md"
keywords = ["shell", "cli", "cross-platform", "terminal", "translator"]
categories = ["command-line-utilities"]
exclude = [".github/", "assets/", "packaging/", "playground/", "site/", "install.sh", "install.ps1"]

[features]
default = ["cli"]
# The interactive shell. Without it, only the translator library is built
# (that's what the browser playground uses).
cli = ["dep:ctrlc", "dep:rustyline"]

[[bin]]
name = "polysh"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
ctrlc = { version = "3.5.2", optional = true }
rustyline = { version = "19.0.0", features = ["derive"], optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
