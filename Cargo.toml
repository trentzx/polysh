[package]
name = "polysh"
version = "0.2.0"
edition = "2021"
description = "A shell that understands Windows cmd and Linux/macOS commands, and translates them to whatever OS you're on."
license = "MIT"
repository = "https://github.com/trentzx/polysh"
readme = "README.md"
keywords = ["shell", "cli", "cross-platform", "terminal", "translator"]
categories = ["command-line-utilities"]
exclude = [".github/", "assets/", "packaging/", "install.sh", "install.ps1"]

[dependencies]
ctrlc = "3.5.2"
rustyline = { version = "19.0.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
